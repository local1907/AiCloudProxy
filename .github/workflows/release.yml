name: Create Release (Store-only distribution)

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Signed binaries are published exclusively through the Microsoft Store.
      # GitHub releases only announce the version and its notes, and the app links
      # to them from the update banner.
      - name: Create GitHub Release (release notes only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI Cloud Proxy ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
