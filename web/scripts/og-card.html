<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  /* 1200x630 Open Graph / Twitter social card for AICloudProxy.com.
     Regenerate web/assets/og-image.png: open this file in a browser at a 1200x630
     viewport and save a screenshot (Playwright: setViewportSize{1200,630} then
     page.screenshot -> web/assets/og-image.png). */
  html, body { width: 1200px; height: 630px; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    color: #e6edf7;
    background: radial-gradient(560px 420px at 50% 34%, rgba(58,175,169,0.16), transparent 70%),
                linear-gradient(180deg, #0b1220 0%, #172a50 100%);
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  .providers {
    margin-top: 34px;
    font-size: 20px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: #8fb4b1;
  }
  .providers span { color: #3AAFA9; padding: 0 10px; }
  .logo { width: 150px; height: 150px; margin-top: 26px; border-radius: 20px;
          box-shadow: 0 18px 40px -18px rgba(3,10,20,0.9); }
  h1 { margin: 18px 0 0; font-size: 62px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { margin: 6px 0 0; font-size: 29px; color: #9fb0c6; }
  .tag { margin-top: 30px; font-size: 18px; color: #7f93ad; }
</style>
</head>
<body>
  <div class="providers">DeepSeek<span>·</span>OpenAI<span>·</span>Gemini<span>·</span>Claude</div>
  <img class="logo" src="../assets/logo.svg" alt="AI Cloud Proxy" width="150" height="150">
  <h1>AI Cloud Proxy</h1>
  <p class="sub">One Ollama endpoint. Your favorite cloud AI.</p>
  <p class="tag">Ollama-compatible &nbsp;|&nbsp; Free for Windows</p>
</body>
</html>
